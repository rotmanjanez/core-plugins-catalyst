name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  change-detection:
    name: 🔍 Change
    uses: rotmanjanez/workflows/.github/workflows/reusable-change-detection.yml@21c111be67b861f787099d518017a17ecac47c49 # feat/python-version-matrix
    permissions:
      contents: read

  python-lint:
    name: 🐍 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-linter)
    uses: rotmanjanez/workflows/.github/workflows/reusable-python-linter.yml@21c111be67b861f787099d518017a17ecac47c49 # feat/python-version-matrix
    with:
      enable-ty: true
      enable-mypy: false
      setup-mlir: true
      llvm-version: "8f264586d7521b0e305ca7bb78825aa3382ffef7"
    permissions:
      contents: read

  python-build:
    name: 🐍 Build
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cd)
    uses: rotmanjanez/workflows/.github/workflows/reusable-python-build.yml@21c111be67b861f787099d518017a17ecac47c49 # feat/python-version-matrix
    with:
      compiled: true
      setup-mlir: true
      llvm-version: "8f264586d7521b0e305ca7bb78825aa3382ffef7"
    permissions:
      contents: read

  python-tests:
    name: 🐍 Test
    needs: [change-detection, python-lint, python-build]
    if: >-
      !cancelled()
      && fromJSON(needs.change-detection.outputs.run-python-tests)
      && needs.python-lint.result != 'failure'
      && needs.python-build.result == 'success'
    uses: rotmanjanez/workflows/.github/workflows/reusable-python-tests.yml@21c111be67b861f787099d518017a17ecac47c49 # feat/python-version-matrix
    with:
      compiled: true
      # the fork is not registered with Codecov; the upload would always fail
      enable-coverage: false
      setup-mlir: true
      llvm-version: "8f264586d7521b0e305ca7bb78825aa3382ffef7"
    permissions:
      contents: read
      id-token: write

  cpp-lint:
    name: 🇨 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-linter)
    uses: rotmanjanez/workflows/.github/workflows/reusable-cpp-linter.yml@21c111be67b861f787099d518017a17ecac47c49 # feat/python-version-matrix
    with:
      clang-version: 21
      build-project: true
      setup-python: true
      install-pkgs: "pennylane-catalyst==0.15.0"
      cpp-linter-extra-args: "-std=c++20"
      setup-mlir: true
      llvm-version: "8f264586d7521b0e305ca7bb78825aa3382ffef7"
    permissions:
      contents: read
      pull-requests: write # Needed to post review comments

  # this job does nothing and is only used for branch protection
  required-checks-pass:
    name: 🚦 Check
    if: always()
    needs:
      [
        change-detection,
        python-lint,
        python-build,
        python-tests,
        cpp-lint,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        if: >-
          ${{ contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled') }}
        run: exit 1
